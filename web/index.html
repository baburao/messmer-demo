<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Messmer</title>
    <style id="expo-reset">
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: #111;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: stretch;
      }
      #root {
        display: flex;
        flex: 1;
        width: 100%;
        max-width: 430px;
        height: 100%;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 80px rgba(0,0,0,0.9);
      }

      /* Remove all browser default focus outlines */
      * { outline: none !important; -webkit-tap-highlight-color: transparent; }
      input, textarea, select, button { outline: none !important; box-shadow: none !important; }

      /* Remove iOS input styling */
      input { -webkit-appearance: none; appearance: none; }

      /* Scrollbar hidden for app feel */
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; -ms-overflow-style: none; }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
